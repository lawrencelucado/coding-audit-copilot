name: ci

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  # Evaluation gate: runs the agent against the expert-scored cases and fails
  # the build if diagnosis F1 drops below the bar. Needs an ANTHROPIC_API_KEY
  # repository secret and the public ICD-10-CM file (downloaded in the job).
  eval-gate:
    if: ${{ github.event_name == 'pull_request' }}
    needs: unit-tests
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ICD10_ZIP_URL: ${{ vars.ICD10_ZIP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python scripts/fetch_icd10.py "$ICD10_ZIP_URL"
      - run: python -m evals.run --min-dx-f1 0.85
